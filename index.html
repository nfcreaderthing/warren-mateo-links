<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#8251ed" />
    <meta
      name="description"
      content="Warren Mateo Villasquez's social links and contact details."
    />
    <title>Warren Mateo Villasquez</title>
    <style>
      :root {
        --purple: #8651ed;
        --purple-deep: #6138cf;
        --blue: #174fae;
        --blue-deep: #123e8b;
        --yellow: #ffd400;
        --paper: #fffefa;
        --ink: #171922;
        --muted: #777887;
        --green: #78b788;
        --line: rgba(23, 25, 34, 0.12);
        --portrait: url("./profile.jpg");
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: #eeeaff;
      }

      body {
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 10% 95%, rgba(134, 81, 237, 0.13), transparent 20rem),
          radial-gradient(circle at 93% 7%, rgba(255, 212, 0, 0.2), transparent 18rem),
          #eeeaff;
      }

      .page {
        display: grid;
        width: min(100% - 28px, 940px);
        min-height: 100vh;
        margin: 0 auto;
        place-items: center;
        padding: 32px 0;
      }

      .hub {
        position: relative;
        width: 100%;
        overflow: hidden;
        border: 1px solid rgba(57, 40, 96, 0.15);
        border-radius: 28px;
        background: var(--paper);
        box-shadow:
          0 28px 75px rgba(63, 48, 111, 0.2),
          12px 12px 0 rgba(134, 81, 237, 0.17);
      }

      .banner {
        position: relative;
        display: flex;
        min-height: 115px;
        align-items: flex-start;
        justify-content: space-between;
        overflow: hidden;
        padding: 22px 28px;
        color: white;
        background: var(--purple);
      }

      .banner::before {
        position: absolute;
        right: -7%;
        bottom: -75px;
        left: -5%;
        height: 120px;
        border-radius: 50% 50% 0 0;
        background: var(--paper);
        content: "";
        transform: rotate(-2deg);
      }

      .banner::after {
        position: absolute;
        top: 13px;
        right: -4%;
        width: 65%;
        height: 12px;
        border-radius: 50%;
        background: var(--yellow);
        content: "";
        transform: rotate(4deg);
      }

      .banner-label,
      .sparkle {
        position: relative;
        z-index: 1;
      }

      .banner-label {
        font-size: 0.67rem;
        font-weight: 950;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      .sparkle {
        color: var(--yellow);
        font-size: 1.8rem;
        line-height: 0.7;
        text-shadow: 2px 2px 0 rgba(23, 25, 34, 0.15);
        transform: rotate(10deg);
      }

      .main {
        position: relative;
        display: grid;
        grid-template-columns: minmax(250px, 0.83fr) minmax(360px, 1.17fr);
        gap: clamp(26px, 5vw, 56px);
        align-items: center;
        padding: 4px clamp(25px, 6vw, 68px) 38px;
      }

      .portrait-wrap {
        position: relative;
        width: min(100%, 300px);
        margin: 0 auto;
        aspect-ratio: 0.87;
        padding: 9px;
        border: 3px solid var(--blue);
        border-radius: 48% 48% 44% 44%;
        background: linear-gradient(145deg, var(--yellow), var(--purple) 75%);
        box-shadow:
          0 12px 30px rgba(23, 79, 174, 0.18),
          0 0 0 8px rgba(134, 81, 237, 0.09);
        transform: rotate(-2deg);
      }

      .portrait {
        width: 100%;
        height: 100%;
        border: 4px solid white;
        border-radius: inherit;
        background: var(--portrait) center / cover no-repeat;
        box-shadow: inset 0 -30px 55px rgba(14, 28, 54, 0.12);
      }

      .badge {
        position: absolute;
        right: -12px;
        bottom: 34px;
        display: grid;
        width: 64px;
        height: 64px;
        place-items: center;
        border: 3px solid white;
        border-radius: 20px;
        color: var(--blue);
        background: var(--yellow);
        box-shadow: 0 8px 17px rgba(23, 25, 34, 0.18);
        font-size: 1.7rem;
        transform: rotate(11deg);
      }

      .details {
        min-width: 0;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 9px;
        margin: 0 0 15px;
        color: var(--blue);
        font-size: 0.68rem;
        font-weight: 950;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        width: 23px;
        height: 3px;
        border-radius: 9px;
        background: var(--yellow);
        content: "";
      }

      h1 {
        max-width: 440px;
        margin: 0;
        color: var(--blue);
        font-size: clamp(2.45rem, 6vw, 4.7rem);
        font-weight: 950;
        letter-spacing: -0.085em;
        line-height: 0.92;
        overflow-wrap: anywhere;
      }

      .name-accent {
        position: relative;
        display: inline-block;
        color: var(--purple);
      }

      .name-accent::after {
        position: absolute;
        right: -2px;
        bottom: -5px;
        left: 4px;
        z-index: -1;
        height: 12px;
        border-radius: 50%;
        background: rgba(255, 212, 0, 0.76);
        content: "";
        transform: rotate(-2deg);
      }

      .links {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-top: 28px;
      }

      .link {
        display: flex;
        min-width: 0;
        min-height: 67px;
        align-items: center;
        gap: 10px;
        padding: 9px 11px;
        color: var(--ink);
        text-decoration: none;
        border: 1px solid var(--line);
        border-radius: 15px;
        background: white;
        box-shadow: 0 4px 11px rgba(43, 45, 67, 0.04);
        transition:
          transform 170ms ease,
          box-shadow 170ms ease,
          border-color 170ms ease,
          background 170ms ease;
      }

      .link:hover,
      .link:focus-visible {
        border-color: rgba(134, 81, 237, 0.46);
        background: #fcfaff;
        box-shadow: 0 9px 20px rgba(81, 62, 142, 0.13);
        outline: none;
        transform: translateY(-3px) rotate(-0.7deg);
      }

      .icon {
        display: grid;
        width: 39px;
        height: 39px;
        flex: 0 0 39px;
        place-items: center;
        border-radius: 12px;
        color: white;
        background: var(--blue);
      }

      .link:nth-child(2) .icon {
        color: var(--blue-deep);
        background: #e4d8ff;
      }

      .link:nth-child(3) .icon {
        color: var(--ink);
        background: #fff0a1;
      }

      .link:nth-child(4) .icon {
        background: var(--purple);
      }

      .link:nth-child(5) .icon {
        color: var(--blue-deep);
        background: #dcecff;
      }

      .link:nth-child(6) .icon {
        color: #28623e;
        background: #def3e1;
      }

      .link:nth-child(7) .icon {
        color: #a94255;
        background: #ffe0e4;
      }

      .icon svg {
        width: 19px;
        height: 19px;
        fill: currentColor;
      }

      .copy {
        display: grid;
        min-width: 0;
        gap: 3px;
      }

      .copy strong {
        overflow: hidden;
        font-size: 0.81rem;
        font-weight: 900;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .copy span {
        overflow: hidden;
        color: var(--muted);
        font-size: 0.68rem;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .bottom-line {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 22px;
        color: var(--muted);
        font-size: 0.65rem;
        font-weight: 850;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .bottom-line span:last-child {
        color: var(--purple);
      }

      @media (max-width: 720px) {
        .page {
          width: min(100% - 16px, 560px);
          padding: 12px 0;
        }

        .hub {
          border-radius: 22px;
        }

        .banner {
          min-height: 95px;
          padding: 19px 21px;
        }

        .main {
          grid-template-columns: 1fr;
          gap: 31px;
          padding: 8px 22px 27px;
        }

        .portrait-wrap {
          width: min(65%, 260px);
          aspect-ratio: 0.98;
        }

        .badge {
          right: -14px;
          bottom: 22px;
          width: 55px;
          height: 55px;
        }

        h1 {
          max-width: 480px;
          font-size: clamp(2.8rem, 12vw, 4.5rem);
        }
      }

      @media (max-width: 420px) {
        .links {
          grid-template-columns: 1fr;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
